// Canonical proto3 definition for ActionabilityDecision (v2.1).
// Source of truth: packages/core/src/inference-engine.ts.

syntax = "proto3";

package llm_feedback_middleware.v2;

import "google/protobuf/timestamp.proto";

enum Axis {
  AXIS_UNSPECIFIED = 0;
  AXIS_DETECTION = 1;
  AXIS_CONTENT = 2;
  AXIS_TIMING = 3;
  AXIS_CHANNEL = 4;
}

enum AxisInference {
  AXIS_INFERENCE_UNSPECIFIED = 0;
  AXIS_INFERENCE_ACTIONABLE_POSITIVE = 1;
  AXIS_INFERENCE_ACTIONABLE_NEGATIVE = 2;
  AXIS_INFERENCE_CONTINUE_TO_OBSERVE = 3;
}

message ActionabilityDecision {
  string decision_id = 1;
  string rule_id = 2;
  string rule_version = 3;
  google.protobuf.Timestamp rule_run_at = 4;
  string artifact_id = 5;
  Axis axis = 6;
  AxisInference inference = 7;
  repeated string evidence_event_ids = 8;
}
