name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    # Run the full integration matrix on Node 22, then a leaner test pass on
    # 18 and 20 to back the engines field's `>= 18` claim. The lean pass
    # skips service-container tests because adding the matrix would multiply
    # CI minutes without catching anything Node-specific.
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    runs-on: ubuntu-latest

    services:
      # Service containers are present on every matrix entry but are only
      # used by the Node 22 entry's full integration tests. Other entries
      # skip the service-container tests via the `if:` guards below.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback
          POSTGRES_DB: feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FEEDBACK_TEST_DATABASE_URL: postgres://feedback:feedback@localhost:5432/feedback_test
      FEEDBACK_TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (required by adapter packages)
        run: pnpm --filter @llm-feedback-middleware/core build

      - name: Build adapter-conformance (required by tests)
        run: pnpm --filter @llm-feedback-middleware/adapter-conformance build

      - name: Lint
        if: matrix.node-version == 22
        run: pnpm lint

      - name: Format check
        if: matrix.node-version == 22
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (in-memory + core)
        run: pnpm --filter @llm-feedback-middleware/core --filter @llm-feedback-middleware/in-memory test

      - name: Test (streams + reference)
        run: pnpm --filter @llm-feedback-middleware/streams --filter @llm-feedback-middleware/reference test

      - name: Test (postgres, against service container)
        if: matrix.node-version == 22
        run: pnpm --filter @llm-feedback-middleware/postgres test

      - name: Test (redis-pubsub, against service container)
        if: matrix.node-version == 22
        run: pnpm --filter @llm-feedback-middleware/redis-pubsub test

      - name: Dependency boundaries
        if: matrix.node-version == 22
        run: pnpm depcheck

      - name: Build all packages
        run: pnpm build

      - name: Bundle-size budgets
        if: matrix.node-version == 22
        run: pnpm size:check
