name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback
          POSTGRES_DB: feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FEEDBACK_TEST_DATABASE_URL: postgres://feedback:feedback@localhost:5432/feedback_test
      FEEDBACK_TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (required by adapter packages)
        run: pnpm --filter @llm-feedback-middleware/core build

      - name: Build adapter-conformance (required by tests)
        run: pnpm --filter @llm-feedback-middleware/adapter-conformance build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (in-memory + core)
        run: pnpm --filter @llm-feedback-middleware/core --filter @llm-feedback-middleware/in-memory test

      - name: Test (postgres, against service container)
        run: pnpm --filter @llm-feedback-middleware/postgres test

      - name: Test (redis-pubsub, against service container)
        run: pnpm --filter @llm-feedback-middleware/redis-pubsub test

      - name: Dependency boundaries
        run: pnpm depcheck

      - name: Build all packages
        run: pnpm build
